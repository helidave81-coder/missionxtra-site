<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MissionXtra</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      color: #f5f7fa; padding: 24px;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2b45 0%, #0b0f16 55%, #070a10 100%);
    }
    .wrap { max-width: 560px; }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 26px; border-radius: 20px;
      display: grid; place-items: center; font-weight: 800; font-size: 30px; letter-spacing: -1px;
      background: linear-gradient(135deg, #ff7a1a, #ff4d4d); color: #fff;
      box-shadow: 0 12px 40px rgba(255,90,40,0.35);
    }
    h1 { font-size: clamp(34px, 7vw, 54px); font-weight: 800; letter-spacing: -1.5px; }
    h1 span { background: linear-gradient(135deg,#ff7a1a,#ff4d4d); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { margin-top: 16px; font-size: 17px; line-height: 1.6; color: #9fb0c3; }
    .tag { margin-top: 30px; display: inline-block; padding: 8px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 600; letter-spacing: .3px; color: #ffb583;
      border: 1px solid rgba(255,122,26,0.35); background: rgba(255,122,26,0.08); }
    a.app { margin-top: 30px; display: inline-block; color: #9fb0c3; font-size: 14px; text-decoration: none; }
    a.app:hover { color: #fff; }
    footer { position: fixed; bottom: 20px; font-size: 12px; color: #55657a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">MX</div>
    <h1>Mission<span>Xtra</span></h1>
    <p>Certified weight &amp; balance and performance planning for rotary-wing operators.</p>
    <div class="tag">Website coming soon</div>
    <br />
    <a class="app" href="https://app.missionxtra.com">Operator login &rarr;</a>
  </div>
  <footer>&copy; MissionXtra</footer>
</body>
</html>
